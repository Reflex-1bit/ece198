<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Patient Game Log — Arduino Connected</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Segoe UI',Tahoma,Verdana,sans-serif;background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;padding:20px}
    .container{max-width:1200px;margin:0 auto}
    .header{background:white;border-radius:15px;padding:30px;margin-bottom:20px;box-shadow:0 10px 30px rgba(0,0,0,.2)}
    .patient-info{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
    .patient-name-input{font-size:28px;font-weight:bold;color:#333;border:2px solid transparent;border-radius:8px;padding:8px 12px;background:#f8f9fa;transition:.3s;width:100%;max-width:400px}
    .patient-name-input:hover{border-color:#667eea;background:white}
    .patient-name-input:focus{outline:none;border-color:#667eea;background:white;box-shadow:0 0 0 3px rgba(102,126,234,.1)}
    .session-date{color:#666;font-size:14px}
    .connection-status{display:flex;align-items:center;gap:10px;padding:15px;background:#e8f5e9;border-radius:10px;margin-bottom:20px}
    .status-indicator{width:12px;height:12px;border-radius:50%;background:#9e9e9e;animation:pulse 2s infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
    .score-display{background:linear-gradient(135deg,#f093fb,#f5576c);border-radius:20px;padding:40px;text-align:center;color:white;box-shadow:0 10px 30px rgba(0,0,0,.2)}
    .score-label{font-size:18px;opacity:.9;margin-bottom:10px;letter-spacing:2px}
    .score-value{font-size:72px;font-weight:bold;text-shadow:0 4px 10px rgba(0,0,0,.3)}
    .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:15px;margin-top:20px}
    .stat-card{background:white;border-radius:15px;padding:20px;box-shadow:0 5px 15px rgba(0,0,0,.1)}
    .stat-label{color:#666;font-size:14px;margin-bottom:8px}
    .stat-value{color:#333;font-size:32px;font-weight:bold}

    .tabs{display:flex;gap:10px;margin-top:20px}
    .tab-btn{padding:12px 24px;border-radius:8px;background:#f5f5f5;cursor:pointer;font-weight:600;transition:.3s}
    .tab-btn.active{background:#667eea;color:white}
    .tab-content{display:none}
    .tab-content.active{display:block}

    .log-section{background:white;border-radius:15px;padding:30px;margin-top:20px;box-shadow:0 10px 30px rgba(0,0,0,.2)}
    .log-title{font-size:24px;margin-bottom:20px;color:#333}
    .log-entry{padding:15px;border-left:4px solid #667eea;background:#f8f9fa;margin-bottom:10px;border-radius:5px}
    .log-time{color:#666;font-size:12px;margin-bottom:5px}
    button{padding:12px 24px;border:none;border-radius:8px;font-size:16px;cursor:pointer;font-weight:600;transition:.3s}
    .btn-primary{background:#667eea;color:white}
    .btn-secondary{background:#f5f5f5;color:#333}

    video{width:100%;max-width:600px;border-radius:15px;margin-top:20px;box-shadow:0 5px 15px rgba(0,0,0,.2)}
    .controls{display:flex;gap:10px;flex-wrap:wrap}
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="patient-info">
        <div>
          <input type="text" class="patient-name-input" id="patientName" value="Patient Name">
          <div class="session-date" id="sessionDate">Session: Loading...</div>
        </div>
      </div>

      <div class="connection-status">
        <div class="status-indicator" id="statusIndicator"></div>
        <span id="connectionText">Disconnected</span>
      </div>

      <div class="score-display">
        <div class="score-label">Current Score</div>
        <div class="score-value" id="currentScore">0</div>
      </div>

      <div class="stats-grid">
        <div class="stat-card"><div class="stat-label">High Score</div><div class="stat-value" id="highScore">0</div></div>
        <div class="stat-card"><div class="stat-label">Games Played</div><div class="stat-value" id="gamesPlayed">0</div></div>
        <div class="stat-card"><div class="stat-label">Session Time</div><div class="stat-value" id="sessionTime">0:00</div></div>
      </div>

      <div class="controls" style="margin-top:20px">
        <button class="btn-primary" id="connectSerialBtn">Connect Arduino</button>
        <button class="btn-secondary" id="resetScoreBtn">Reset Score</button>
        <button class="btn-primary" id="startCameraBtn">Start Camera</button>
        <button class="btn-secondary" id="stopCameraBtn">Stop Camera</button>
      </div>
    </div>

    <div class="tabs">
      <div class="tab-btn active" data-target="logTab">Activity Log</div>
      <div class="tab-btn" data-target="storedTab">Stored Scores</div>
      <div class="tab-btn" data-target="cameraTab">Camera</div>
    </div>

    <div id="logTab" class="tab-content active log-section">
      <div class="log-title">Activity Log</div>
      <div id="activityLog"></div>
    </div>

    <div id="storedTab" class="tab-content log-section">
      <div class="log-title">Stored Scores</div>
      <button class="btn-primary" id="storeScoreBtn">Store Current Score</button>
      <div id="storedScores" style="margin-top:20px"></div>
    </div>

    <div id="cameraTab" class="tab-content log-section">
      <div class="log-title">Camera</div>
      <video id="cameraFeed" autoplay playsinline></video>
    </div>
  </div>

  <script>
  // ---------------- state ----------------
  let storedScores = [];
  let gameState = { score: 0, highScore: 0, gamesPlayed: 0, sessionStartTime: Date.now(), isPlaying: false };
  let cameraStream = null;
  let serialPort = null;
  let serialReader = null;

  // ---------------- logging / UI helpers ----------------
  function addLogEntry(msg){
    const container = document.getElementById('activityLog');
    const entry = document.createElement('div');
    entry.className = 'log-entry';
    const time = new Date().toLocaleTimeString();
    entry.innerHTML = `<div class="log-time">${time}</div><div>${msg}</div>`;
    container.prepend(entry);
  }

  function updateDateTime(){
    const now = new Date();
    document.getElementById('sessionDate').textContent = `Session: ${now.toLocaleDateString()} ${now.toLocaleTimeString()}`;
  }
  setInterval(updateDateTime,1000);
  updateDateTime(); // immediate update

  function updateSessionTime(){
    const elapsedSec = Math.floor((Date.now() - gameState.sessionStartTime) / 1000);
    document.getElementById('sessionTime').textContent = `${Math.floor(elapsedSec/60)}:${(elapsedSec%60).toString().padStart(2,'0')}`;
  }
  setInterval(updateSessionTime,1000);
  updateSessionTime(); // immediate update

  function updateScore(n){
    gameState.score = n;
    document.getElementById('currentScore').textContent = n;
    if(n > gameState.highScore){
      gameState.highScore = n;
      document.getElementById('highScore').textContent = n;
      addLogEntry(`New high score: ${n}!`);
    }
  }

  function resetScore(){
    gameState.score = 0;
    updateScore(0);
    addLogEntry('Score reset');
  }

  function storeCurrentScore(){
    storedScores.push({score: gameState.score, time: Date.now()});
    localStorage.setItem('pg_storedScores', JSON.stringify(storedScores));
    renderStoredScores();
    addLogEntry(`Stored score: ${gameState.score}`);
  }

  function renderStoredScores(){
    const el = document.getElementById('storedScores');
    if(storedScores.length === 0){ el.innerHTML = '<div>No scores stored yet.</div>'; return; }
    el.innerHTML = storedScores.map(s => `<div class="log-entry">${new Date(s.time).toLocaleString()} — Score: <strong>${s.score}</strong></div>`).join('');
  }

  // ---------------- camera ----------------
  async function startCamera(){
    try{
      if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('getUserMedia not supported');
      cameraStream = await navigator.mediaDevices.getUserMedia({video:true, audio:false});
      const video = document.getElementById('cameraFeed');
      video.srcObject = cameraStream;
      await video.play();
      addLogEntry('Camera started');
    }catch(err){
      console.error('Camera error:', err);
      addLogEntry('Camera error: ' + (err.message || err));
      alert('Unable to access camera: ' + (err.message || err));
    }
  }

  function stopCamera(){
    if(cameraStream){
      cameraStream.getTracks().forEach(t => t.stop());
      cameraStream = null;
      const video = document.getElementById('cameraFeed');
      video.srcObject = null;
      addLogEntry('Camera stopped');
    } else addLogEntry('Camera was not running');
  }

  // ---------------- Web Serial (Arduino integration) ----------------
  function setConnectedUI(connected){
    const ind = document.getElementById('statusIndicator');
    const text = document.getElementById('connectionText');
    const btn = document.getElementById('connectSerialBtn');
    if(connected){
      ind.style.background = '#4caf50';
      text.textContent = 'Connected';
      btn.textContent = 'Disconnect Arduino';
    } else {
      ind.style.background = '#9e9e9e';
      text.textContent = 'Disconnected';
      btn.textContent = 'Connect Arduino';
    }
  }

  async function connectSerial(){
    try{
      if (!('serial' in navigator)){
        alert('Web Serial API not available in this browser. Use Chrome/Edge/Brave.');
        return;
      }

      // Toggle disconnect if already connected
      if (serialPort){
        await disconnectSerial();
        return;
      }

      try {
        serialPort = await navigator.serial.requestPort();
      } catch(e){
        addLogEntry('User cancelled port selection');
        return;
      }

      await serialPort.open({ baudRate: 9600 });
      setConnectedUI(true);
      addLogEntry('Serial connected — reading from Arduino');

      const textDecoder = new TextDecoderStream();
      serialPort.readable.pipeTo(textDecoder.writable);
      serialReader = textDecoder.readable.getReader();

      while(true){
        const { value, done } = await serialReader.read();
        if (done) break;
        if (!value) continue;
        value.split(/\r?\n/).forEach(line => {
          if(line.trim()) handleSerialLine(line.trim());
        });
      }
    }catch(err){
      console.error('Serial error', err);
      addLogEntry('Serial error: ' + (err.message || err));
      alert('Serial error: ' + (err.message || err));
      try{ await disconnectSerial(); }catch(e){}
    }
  }

  async function disconnectSerial(){
    try{
      if(serialReader){ try{ await serialReader.cancel(); }catch(e){} try{ serialReader.releaseLock(); }catch(e){} serialReader = null; }
      if(serialPort){ try{ await serialPort.close(); }catch(e){} serialPort = null; }
    }catch(e){ console.warn('Disconnect cleanup failed', e); }
    setConnectedUI(false);
    addLogEntry('Serial disconnected');
  }

  // Parser tailored to your Arduino output (no Arduino changes required)
  function handleSerialLine(line){
    const trimmed = line.trim();
    if(!trimmed) return;

    // 1) Score lines: "Score: <n>"
    const scoreMatch = trimmed.match(/^Score:\s*(\d+)\s*$/i);
    if(scoreMatch){
      const n = parseInt(scoreMatch[1],10);
      if(!isNaN(n)){ updateScore(n); addLogEntry('Score updated from device: ' + n); }
      else addLogEntry('Received SCORE line but value not a number: ' + trimmed);
      return;
    }

    // 2) New round banner
    if(trimmed.indexOf('=== New Round ===') !== -1){
      addLogEntry('Device: New round started');
      gameState.gamesPlayed = (gameState.gamesPlayed || 0) + 1;
      document.getElementById('gamesPlayed').textContent = gameState.gamesPlayed;
      const innerScore = trimmed.match(/\|\s*Score:\s*(\d+)/i);
      if(innerScore){ const n = parseInt(innerScore[1],10); if(!isNaN(n)) updateScore(n); }
      return;
    }

    // 3) Rounds played
    const roundsMatch = trimmed.match(/^Rounds played:\s*(\d+)\s*$/i);
    if(roundsMatch){ const r = parseInt(roundsMatch[1],10); if(!isNaN(r)){ gameState.gamesPlayed = r; document.getElementById('gamesPlayed').textContent = r; addLogEntry('Device: rounds played = ' + r); } return; }

    // 4) Simple textual events
    if(/watch the pattern/i.test(trimmed)){ addLogEntry('Device: showing pattern'); return; }
    if(/your turn/i.test(trimmed)){ addLogEntry('Device: waiting for user input'); return; }
    if(/select difficulty/i.test(trimmed) || /^Difficulty selected:/i.test(trimmed)){ addLogEntry('Device: ' + trimmed); return; }
    if(/game over/i.test(trimmed)){ addLogEntry('Device: GAME OVER — ' + trimmed); return; }

    // 5) Steps or LEDs
    if(/^Step\s+\d+/i.test(trimmed) || /^LED\s+\d+\s*-\s*/i.test(trimmed) || /^PATTERN_STEP:/i.test(trimmed)){ addLogEntry('Device: ' + trimmed); return; }

    // fallback
    addLogEntry('Serial: ' + trimmed);
  }

  // ---------------- init / wiring ----------------
  function switchTab(target){ document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active')); document.querySelectorAll('.tab-content').forEach(s=>s.classList.remove('active')); document.querySelector(`[data-target="${target}"]`)?.classList.add('active'); document.getElementById(target)?.classList.add('active'); }

  function init(){
    document.getElementById('connectSerialBtn').addEventListener('click', connectSerial);
    document.getElementById('resetScoreBtn').addEventListener('click', resetScore);
    document.getElementById('storeScoreBtn').addEventListener('click', storeCurrentScore);
    document.getElementById('startCameraBtn').addEventListener('click', startCamera);
    document.getElementById('stopCameraBtn').addEventListener('click', stopCamera);
    document.querySelectorAll('.tab-btn').forEach(btn=>btn.addEventListener('click', ()=>switchTab(btn.dataset.target)));

    try{ const raw = localStorage.getItem('pg_storedScores'); if(raw) storedScores = JSON.parse(raw); }catch(e){ storedScores = []; }
    renderStoredScores();
    updateDateTime(); updateSessionTime();
    setInterval(updateDateTime,1000); setInterval(updateSessionTime,1000);
    addLogEntry('App initialized — connect your Arduino to use real scores.');
  }

  window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
